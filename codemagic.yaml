workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Set up code signing
        script: |
          # Initialize the keychain
          keychain initialize
          # Install certificate
          if [ -n "$CM_CERTIFICATE" ]; then
            echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
            keychain add-certificates --p12 /tmp/certificate.p12 --p12-password "$CM_CERTIFICATE_PASSWORD"
          fi
          # Manually install provisioning profile if provided as env var
          if [ -n "$CM_PROVISIONING_PROFILE" ]; then
            echo "Installing profile from environment variable..."
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$CM_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          fi
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          # Always recreate the iOS platform from scratch on the build server
          echo "Re-initializing iOS platform for a clean build..."
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          # FORCE the bundle ID in the Xcode project file
          # This ensures the project matches your provisioning profile
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = com.smartplanner.kids;/g' ios/App/App.xcodeproj/project.pbxproj
          
          echo "Current Bundle ID in project:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj | head -n 1
          
          # List available profiles for debugging
          echo "Available Provisioning Profiles:"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles || echo "No profiles found in directory"
          
          # Apply the provisioning profiles
          xcode-project use-profiles --bundle-id com.smartplanner.kids
          
          # Find where the signing file was created and move it to the expected location
          EXPORT_PLIST=$(find /Users/builder -name "export_options.plist" | head -n 1)
          if [ -n "$EXPORT_PLIST" ]; then
            echo "Found export_options.plist at $EXPORT_PLIST. Moving to /Users/builder/export_options.plist"
            cp "$EXPORT_PLIST" /Users/builder/export_options.plist
          else
            echo "CRITICAL: export_options.plist was not generated by xcode-project use-profiles"
          fi
      - name: Build iOS IPA
        script: |
          # Build the IPA using the generated export options
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vjayjaina@gmail.com
