workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Set up code signing
        script: |
          # Initialize the keychain and install certificates
          keychain initialize
          keychain add-certificates
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          # Always recreate the iOS platform from scratch on the build server
          echo "Re-initializing iOS platform for a clean build..."
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          # NOW apply the provisioning profiles to the fresh project
          xcode-project use-profiles
          # Verify the project exists
          ls -d ios/App/App.xcodeproj
      - name: Build iOS IPA
        script: |
          # This command builds the archive and exports the IPA
          # Capacitor 6+ uses the .xcodeproj with Swift Package Manager
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vjayjaina@gmail.com
