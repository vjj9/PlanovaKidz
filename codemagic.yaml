workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Set up code signing
        script: |
          # Initialize the keychain
          keychain initialize
          # Fetch and install certificates from Codemagic UI environment variables
          # If the automatic search fails, we try to use the variables directly
          if [ -n "$CM_CERTIFICATE" ]; then
            echo "Installing certificate from environment variable..."
            echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
            keychain add-certificates --p12 /tmp/certificate.p12 --p12-password "$CM_CERTIFICATE_PASSWORD"
          else
            echo "Searching for certificates in default locations..."
            keychain add-certificates || echo "No certificates found in default locations."
          fi
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          # Always recreate the iOS platform from scratch on the build server
          echo "Re-initializing iOS platform for a clean build..."
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          # NOW apply the provisioning profiles to the fresh project
          xcode-project use-profiles
          # Verify the project exists
          ls -d ios/App/App.xcodeproj
      - name: Build iOS IPA
        script: |
          # This command builds the archive and exports the IPA
          # Capacitor 6+ uses the .xcodeproj with Swift Package Manager
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vjayjaina@gmail.com
