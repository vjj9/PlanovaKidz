workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Set up code signing
        script: |
          # Initialize the keychain
          keychain initialize
          # Fetch and install certificates from Codemagic UI environment variables
          # If the automatic search fails, we try to use the variables directly
          if [ -n "$CM_CERTIFICATE" ]; then
            echo "Installing certificate from environment variable..."
            echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
            keychain add-certificates --p12 /tmp/certificate.p12 --p12-password "$CM_CERTIFICATE_PASSWORD"
          else
            echo "Searching for certificates in default locations..."
            keychain add-certificates || echo "No certificates found in default locations."
          fi
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          # Always recreate the iOS platform from scratch on the build server
          echo "Re-initializing iOS platform for a clean build..."
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          # FORCE the bundle ID in the Xcode project file
          # This ensures the project matches your provisioning profile
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = com.smartplanner.kids;/g' ios/App/App.xcodeproj/project.pbxproj
          
          echo "Current Bundle ID in project:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj | head -n 1
          
          # List available profiles for debugging
          echo "Available Provisioning Profiles:"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles || echo "No profiles found in directory"
          
          # Apply the provisioning profiles
          xcode-project use-profiles --bundle-id com.smartplanner.kids
          
          # Check if the signing file was created
          ls -l /Users/builder/export_options.plist || echo "export_options.plist STILL MISSING"
      - name: Build iOS IPA
        script: |
          # Build the IPA using the generated export options
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vjayjaina@gmail.com
