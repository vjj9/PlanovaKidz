workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          # Ensure the iOS platform is fully initialized
          # If the workspace is missing (common when pushing from Windows), recreate it
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "iOS workspace not found. Re-initializing iOS platform..."
            rm -rf ios
            npx cap add ios
          fi
          npx cap sync ios
      - name: Build iOS IPA
        script: |
          # This command builds the archive and exports the IPA
          # Codemagic will automatically inject the code signing identities 
          # if you upload them to the "Code Signing" section in the UI.
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vjayjaina@gmail.com
