workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      groups:
        - apple_credentials
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Set up code signing
        script: |
          # Initialize the keychain
          keychain initialize
          
          echo "--- Code Signing Diagnostics ---"
          [ -n "$CM_CERTIFICATE" ] && echo "✅ CM_CERTIFICATE is available" || echo "❌ CM_CERTIFICATE is MISSING"
          [ -n "$CM_PROVISIONING_PROFILE" ] && echo "✅ CM_PROVISIONING_PROFILE is available" || echo "❌ CM_PROVISIONING_PROFILE is MISSING"
          echo "--------------------------------"

          # 1. Handle Certificate (CM_CERTIFICATE)
          if [ -n "$CM_CERTIFICATE" ]; then
            if [ -f "$CM_CERTIFICATE" ]; then
              echo "CM_CERTIFICATE detected as a file path. Using directly..."
              keychain add-certificates --certificate "$CM_CERTIFICATE" --certificate-password "${CM_CERTIFICATE_PASSWORD:-}"
            else
              echo "CM_CERTIFICATE detected as base64. Decoding..."
              # Use -D for macOS base64 decoding which is more standard on Codemagic
              echo "$CM_CERTIFICATE" | base64 -D > /tmp/certificate.p12 2>/dev/null || echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
              keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password "${CM_CERTIFICATE_PASSWORD:-}"
            fi
          fi

          # 2. Handle Provisioning Profile (CM_PROVISIONING_PROFILE)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -n "$CM_PROVISIONING_PROFILE" ]; then
            if [ -f "$CM_PROVISIONING_PROFILE" ]; then
              echo "CM_PROVISIONING_PROFILE detected as a file path. Copying..."
              cp "$CM_PROVISIONING_PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
            else
              echo "CM_PROVISIONING_PROFILE detected as base64. Decoding..."
              echo "$CM_PROVISIONING_PROFILE" | base64 -D > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision 2>/dev/null || echo "$CM_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
            fi
          fi

          echo "Final Profiles in folder:"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build web app
        script: |
          # Ensure GEMINI_API_KEY is available for the build
          # If it's not in the environment, Vite will bundle 'undefined'
          export GEMINI_API_KEY="${GEMINI_API_KEY:-}"
          npm run build
      - name: Sync Capacitor
        script: |
          # Always recreate the iOS platform from scratch on the build server
          echo "Re-initializing iOS platform for a clean build..."
          rm -rf ios
          
          # Add the platform first so the folder exists
          npx cap add ios

          # Generate native assets (icons/splash) if the assets folder exists
          # We do this AFTER 'cap add' so we overwrite the default Capacitor icons
          if [ -d "assets" ]; then
            echo "Generating native assets..."
            npm run resources || echo "⚠️ Asset generation failed. Using defaults."
          else
            echo "ℹ️ No 'assets' folder found. Using default Capacitor icons."
          fi

          npx cap sync ios
          
          # FORCE the bundle ID in the Xcode project file (Aggressive mode)
          echo "Forcing Bundle ID: com.planovakidz.app"
          find ios/App/App.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = com.planovakidz.app;/g' {} +
          
          # Fix Export Compliance (ITSAppUsesNonExemptEncryption) to avoid manual steps in App Store Connect
          echo "Setting Export Compliance to NO..."
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          fi

          # Increment build number based on timestamp to ensure unique builds
          BUILD_NUMBER=$(date +%s)
          echo "Setting Build Number to $BUILD_NUMBER"
          find ios/App/App.xcodeproj -name "project.pbxproj" -exec sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" {} +

          # Inspect the Provisioning Profile to see what ID it expects
          echo "--- Inspecting Provisioning Profile ---"
          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -n 1)
          if [ -n "$PROFILE_PATH" ]; then
            security cms -D -i "$PROFILE_PATH" | grep -A 1 "application-identifier" || echo "Could not read ID from profile"
          else
            echo "No provisioning profile found to inspect!"
          fi
          echo "---------------------------------------"
          
          # Apply the provisioning profiles with verbose logging
          xcode-project use-profiles --verbose || true

          # Find where use-profiles put the plist, or generate one manually as fallback
          EXPORT_PLIST=$(find /Users/builder -name "export_options.plist" 2>/dev/null | head -n 1)
          if [ -n "$EXPORT_PLIST" ] && [ "$EXPORT_PLIST" != "/Users/builder/export_options.plist" ]; then
            echo "Found export_options.plist at $EXPORT_PLIST. Copying..."
            cp "$EXPORT_PLIST" /Users/builder/export_options.plist
          elif [ -z "$EXPORT_PLIST" ]; then
            echo "use-profiles did not generate export_options.plist — creating manually..."
            PROFILE_UUID=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -n 1 | xargs -I{} sh -c 'security cms -D -i "{}" 2>/dev/null | grep -A1 "<key>UUID</key>" | tail -1 | sed "s/.*<string>\(.*\)<\/string>.*/\1/"')
            echo "Using profile UUID: $PROFILE_UUID"
            # Create the plist using printf to avoid heredoc indentation issues
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>teamID</key>\n  <string>%s</string>\n  <key>provisioningProfiles</key>\n  <dict>\n    <key>com.planovakidz.app</key>\n    <string>%s</string>\n  </dict>\n  <key>signingStyle</key>\n  <string>manual</string>\n  <key>stripSwiftSymbols</key>\n  <true/>\n  <key>uploadBitcode</key>\n  <false/>\n  <key>uploadSymbols</key>\n  <true/>\n</dict>\n</plist>\n' "$APPLE_TEAM_ID" "$PROFILE_UUID" > /Users/builder/export_options.plist
          fi
          echo "--- export_options.plist contents ---"
          cat /Users/builder/export_options.plist
          echo "-------------------------------------"
      - name: Build iOS IPA
        script: |
          # Build the IPA using the generated export options
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --export-options-plist /Users/builder/export_options.plist
      - name: Publish to TestFlight
        script: |
          # Use the API Key variables to upload the IPA to Apple
          # We use the CLI directly to bypass any UI integration issues
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "Publishing IPA to App Store Connect..."
            # We add || true because the upload usually succeeds even if the 'wait for processing' times out
            app-store-connect publish \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
              --testflight || echo "Upload finished, but Apple is still processing. Check App Store Connect for status."
          else
            echo "⚠️ APP_STORE_CONNECT_PRIVATE_KEY is missing. Skipping TestFlight upload."
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vjayjaina@gmail.com

  android-release:
    name: Android Release Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          export GEMINI_API_KEY="${GEMINI_API_KEY:-}"
          npm run build
      - name: Sync Capacitor Android
        script: |
          # Clean start for Android
          rm -rf android
          npx cap add android
          
          # Generate native assets (icons/splash)
          if [ -d "assets" ]; then
            echo "Generating native assets..."
            npm run resources || echo "⚠️ Asset generation failed."
          fi

          # Copy google-services.json if it exists in the root
          if [ -f "google-services.json" ]; then
            echo "Copying google-services.json to Android project..."
            cp google-services.json android/app/
          else
            echo "⚠️ google-services.json NOT FOUND. Firebase will not work on Android."
          fi

          npx cap sync android
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - vjayjaina@gmail.com
