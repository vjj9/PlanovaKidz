workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups:
        - apple_credentials
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Set up code signing
        script: |
          # Initialize the keychain
          keychain initialize
          
          # Search for certificates (Restricted to project and build root to avoid system junk)
          echo "Searching for your certificate..."
          CERT_FILE=$(find . -name "*.p12" | head -n 1)
          if [ -z "$CERT_FILE" ]; then
            CERT_FILE=$(find /Users/builder -maxdepth 2 -name "*.p12" | head -n 1)
          fi

          if [ -n "$CERT_FILE" ]; then
            echo "Found certificate at $CERT_FILE. Installing..."
            # Correct flag is --certificate and --certificate-password
            keychain add-certificates --certificate "$CERT_FILE" --certificate-password "${CM_CERTIFICATE_PASSWORD:-}"
          else
            echo "No .p12 certificate found in project or build root."
            keychain add-certificates || true
          fi
          
          # Search for provisioning profiles
          echo "Searching for provisioning profiles..."
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # Look in project and build root only
          find . -name "*.mobileprovision" -exec cp {} ~/Library/MobileDevice/Provisioning\ Profiles/ \;
          find /Users/builder -maxdepth 2 -name "*.mobileprovision" -exec cp {} ~/Library/MobileDevice/Provisioning\ Profiles/ \;
          
          echo "Profiles found in Provisioning Profiles folder:"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          # Always recreate the iOS platform from scratch on the build server
          echo "Re-initializing iOS platform for a clean build..."
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          # FORCE the bundle ID in the Xcode project file (Aggressive mode)
          echo "Forcing Bundle ID: com.smartplanner.kids"
          find ios/App/App.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = com.smartplanner.kids;/g' {} +
          
          # Inspect the Provisioning Profile to see what ID it expects
          echo "--- Inspecting Provisioning Profile ---"
          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -n 1)
          if [ -n "$PROFILE_PATH" ]; then
            security cms -D -i "$PROFILE_PATH" | grep -A 1 "application-identifier" || echo "Could not read ID from profile"
          else
            echo "No provisioning profile found to inspect!"
          fi
          echo "---------------------------------------"
          
          # Apply the provisioning profiles with verbose logging
          xcode-project use-profiles --bundle-id com.smartplanner.kids --verbose || true

          # Find where use-profiles put the plist, or generate one manually as fallback
          EXPORT_PLIST=$(find /Users/builder -name "export_options.plist" 2>/dev/null | head -n 1)
          if [ -n "$EXPORT_PLIST" ] && [ "$EXPORT_PLIST" != "/Users/builder/export_options.plist" ]; then
            echo "Found export_options.plist at $EXPORT_PLIST. Copying..."
            cp "$EXPORT_PLIST" /Users/builder/export_options.plist
          elif [ -z "$EXPORT_PLIST" ]; then
            echo "use-profiles did not generate export_options.plist — creating manually..."
            PROFILE_UUID=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -n 1 | xargs -I{} sh -c 'security cms -D -i "{}" 2>/dev/null | grep -A1 "<key>UUID</key>" | tail -1 | sed "s/.*<string>\(.*\)<\/string>.*/\1/"')
            echo "Using profile UUID: $PROFILE_UUID"
            # Create the plist without leading spaces to avoid XML errors
            cat > /Users/builder/export_options.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>app-store</string>
  <key>teamID</key>
  <string>REPLACE_TEAM_ID</string>
  <key>provisioningProfiles</key>
  <dict>
    <key>com.smartplanner.kids</key>
    <string>REPLACE_UUID</string>
  </dict>
  <key>signingStyle</key>
  <string>manual</string>
  <key>stripSwiftSymbols</key>
  <true/>
  <key>uploadBitcode</key>
  <false/>
  <key>uploadSymbols</key>
  <true/>
</dict>
</plist>
EOF
            # Inject the variables into the plist
            sed -i '' "s/REPLACE_TEAM_ID/${APPLE_TEAM_ID}/" /Users/builder/export_options.plist
            sed -i '' "s/REPLACE_UUID/${PROFILE_UUID}/" /Users/builder/export_options.plist
          fi
          echo "--- export_options.plist contents ---"
          cat /Users/builder/export_options.plist
          echo "-------------------------------------"
      - name: Build iOS IPA
        script: |
          # Build the IPA using the generated export options
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vjayjaina@gmail.com
