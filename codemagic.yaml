workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          # Always recreate the iOS platform from scratch on the build server
          # This avoids issues with incomplete or broken folders pushed from Windows
          echo "Re-initializing iOS platform for a clean build..."
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          # Explicitly install pods to ensure the workspace is generated
          cd ios/App && pod install && cd ../..
          # Verify the workspace exists
          ls -d ios/App/App.xcworkspace
      - name: Build iOS IPA
        script: |
          # This command builds the archive and exports the IPA
          # Codemagic will automatically inject the code signing identities 
          # if you upload them to the "Code Signing" section in the UI.
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vjayjaina@gmail.com
