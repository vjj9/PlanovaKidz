workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Set up code signing
        script: |
          # Initialize the keychain
          keychain initialize
          # Fetch and install certificates from Codemagic UI environment variables
          # If the automatic search fails, we try to use the variables directly
          if [ -n "$CM_CERTIFICATE" ]; then
            echo "Installing certificate from environment variable..."
            echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
            keychain add-certificates --p12 /tmp/certificate.p12 --p12-password "$CM_CERTIFICATE_PASSWORD"
          else
            echo "Searching for certificates in default locations..."
            keychain add-certificates || echo "No certificates found in default locations."
          fi
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          # Always recreate the iOS platform from scratch on the build server
          echo "Re-initializing iOS platform for a clean build..."
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          # Debug: Check the bundle ID in the project
          echo "Current Bundle ID in project:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj | head -n 1
          
          # NOW apply the provisioning profiles
          # We use --bundle-id to force it to match our app
          xcode-project use-profiles --bundle-id com.smartplanner.kids
          
          # Verify the export options were generated
          if [ -f "/Users/builder/export_options.plist" ]; then
            echo "Export options generated successfully."
          else
            echo "WARNING: export_options.plist not found. Signing might fail."
          fi
      - name: Build iOS IPA
        script: |
          # Build the IPA using the generated export options
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --bundle-id com.smartplanner.kids
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vjayjaina@gmail.com
